apiVersion: v1
kind: Service
metadata:
  name: http-proxy-data-ingestion-service-v2
  namespace: dev-ami-platform-backend
  labels:
    app: http-proxy-data-ingestion-service-v2
    component: data-ingestion
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/q/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: http-proxy-data-ingestion-service-v2
---
apiVersion: v1
kind: Service
metadata:
  name: http-proxy-data-ingestion-service-v2-headless
  namespace: dev-ami-platform-backend
  labels:
    app: http-proxy-data-ingestion-service-v2
    component: data-ingestion
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: http-proxy-data-ingestion-service-v2
