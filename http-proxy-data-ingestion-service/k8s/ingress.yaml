apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-proxy-data-ingestion-service-v2-unified
  namespace: dev-ami-platform-backend
  labels:
    app: http-proxy-data-ingestion-service-v2
    component: data-ingestion
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /mgmt/q/health/ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      # API endpoints (port 8080)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: http-proxy-data-ingestion-service-v2
            port:
              number: 8080
      # Management endpoints (port 9090) - Swagger UI, Health, OpenAPI
      - path: /mgmt
        pathType: Prefix
        backend:
          service:
            name: http-proxy-data-ingestion-service-v2
            port:
              number: 9090
      # Direct access to Swagger UI without /mgmt prefix for convenience
      - path: /q/swagger-ui
        pathType: Prefix
        backend:
          service:
            name: http-proxy-data-ingestion-service-v2
            port:
              number: 9090
      # Direct access to OpenAPI spec without /mgmt prefix
      - path: /q/openapi
        pathType: Prefix
        backend:
          service:
            name: http-proxy-data-ingestion-service-v2
            port:
              number: 9090
      # Direct access to health endpoint without /mgmt prefix
      - path: /q/health
        pathType: Prefix
        backend:
          service:
            name: http-proxy-data-ingestion-service-v2
            port:
              number: 9090
