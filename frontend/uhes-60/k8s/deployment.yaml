apiVersion: apps/v1
kind: Deployment
metadata:
  name: uhes-60-frontend
  namespace: dev-us60-frontend
  labels:
    app: uhes-60-frontend
    version: beta-2.1.20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uhes-60-frontend
  template:
    metadata:
      labels:
        app: uhes-60-frontend
        version: beta-2.1.20
    spec:
      containers:
      - name: uhes-60-frontend
        image: 402495469929.dkr.ecr.us-east-1.amazonaws.com/ami-platform-frontend:beta-2.1.21
        envFrom:
        - configMapRef:
            name: uhes-60-frontend-config
        - secretRef:
            name: uhes-60-frontend-secret
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Temporarily disabled health checks for better logging
        # livenessProbe:
        #   httpGet:
        #     path: /
        #     port: 3000
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /
        #     port: 3000
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
